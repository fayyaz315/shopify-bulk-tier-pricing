query Input {
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }

      merchandise {
        ... on ProductVariant {
          id
          title
          product {
            id
            title
          }
          tieredPricing: metafield(namespace: "custom", key: "tiered_pricing") {
            value
          }
        }
      }
    }
  }
}
